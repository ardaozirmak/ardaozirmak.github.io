<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF8F0">
  <title>Deneyap Atölyem - Sayfa bulunamadı</title>
  <!-- GitHub Pages bilinmeyen her adreste bunu sunar (2026-10-16 denetim: yoktu,
       çocuk GitHub'ın İngilizce 404'ünü görüyordu). Adres herhangi bir alt yol
       olabileceği için bağlantılar KÖKTEN (/...) yazıldı. -->
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #FFF8F0; --kart: #FFFFFF; --metin: #3B2A1E; --soluk: #7C6552; --ana: #D6273A; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1E1712; --kart: #2A211B; --metin: #F5EBE0; --soluk: #C9B5A3; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--metin); font: 17px/1.5 "Nunito", system-ui, sans-serif; }
    main { max-width: 420px; text-align: center; background: var(--kart); border-radius: 24px;
      padding: 32px 24px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    .led { width: 72px; height: 72px; margin: 0 auto 12px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: var(--soluk); }
    a { display: inline-block; background: var(--ana); color: #fff; text-decoration: none;
      font-weight: 800; padding: 12px 22px; border-radius: 14px; }
    a:focus-visible { outline: 3px solid var(--metin); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img class="led" src="/assets/img/favicon.svg" alt="" aria-hidden="true">
    <h1>Bu sayfa sönük</h1>
    <p>Aradığın sayfa burada yok. Belki adres yanlış yazıldı. Derslerine portaldan devam edebilirsin.</p>
    <a href="/portal.html">Portala dön</a>
  </main>
</body>
</html>
